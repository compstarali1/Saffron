<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Saffron Fantasy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        /* Background GIF with 50% opacity */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('saf.gif') center center / cover no-repeat;
            opacity: 0.5;
            z-index: -1;
        }

        .content {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 3D Animated Button */
        .fantasy-btn {
            background: linear-gradient(145deg, #ff69b4, #d81b60);
            color: white;
            border: none;
            padding: 18px 32px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 0 #9c27b0, 0 10px 15px rgba(0,0,0,0.3);
            transform: translateY(-4px);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fantasy-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 0 #9c27b0, 0 5px 10px rgba(0,0,0,0.3);
        }

        /* 3D Animated Progress Bar Container */
        .progress-container {
            margin-top: 40px;
            width: 90%;
            max-width: 350px;
            display: none;
        }

        .progress-bar-wrapper {
            position: relative;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transform: perspective(500px) rotateX(10deg);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4081, #e91e63, #9c27b0);
            border-radius: 12px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.6);
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(233, 30, 99, 0.6); }
            to { box-shadow: 0 0 20px rgba(233, 30, 99, 0.9), 0 0 30px rgba(156, 39, 176, 0.5); }
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <!-- Background GIF -->
    <div class="bg-image"></div>

    <div class="content">
        <!-- 3D Button -->
        <button class="fantasy-btn" id="playBtn">
            <i class="fa fa-music mr-2"></i> My Saffron Fantasy
        </button>

        <!-- Progress Bar Section -->
        <div class="progress-container" id="progressSection">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" src="saf.mp3">

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        // Auto-play attempt on open (may be blocked by browsers)
        window.addEventListener('load', () => {
            audio.play().catch(err => {
                console.log("Auto-play blocked — press the button to play");
            });
        });

        // Play on button press
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                progressSection.style.display = 'block';
            } else {
                audio.pause();
            }
        });

        // Update progress bar
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';

            // Format time
            const formatTime = (secs) => {
                const mins = Math.floor(secs / 60);
                const secsRem = Math.floor(secs % 60);
                return `${mins}:${secsRem < 10 ? '0' : ''}${secsRem}`;
            };

            currentTimeEl.textContent = formatTime(audio.currentTime);
            if (!isNaN(audio.duration)) {
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });
    </script>
</body>
</html>
